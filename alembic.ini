# Alembic configuration for the Virtual Power Plant platform.
#
# The actual database URL is supplied at runtime by ``alembic/env.py``,
# which reads ``vpp.settings.Settings.database_url`` and rewrites any
# ``+aiosqlite`` / ``+asyncpg`` async drivers to their sync equivalents
# for migration purposes.  Set ``VPP_DATABASE_URL`` to override.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
