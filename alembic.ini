# Alembic configuration for the Virtual Power Plant platform.
#
# The migration environment and revisions live inside the package, in
# ``src/vpp/migrations/`` (so installed wheels ship them and ``vpp migrate``
# works from any directory).  This file lets the ``alembic`` CLI be used from
# the repository root for authoring and inspecting revisions.
#
# The actual database URL is supplied at runtime by the migrations ``env.py``,
# which reads ``vpp.settings.Settings.database_url`` and rewrites any
# ``+aiosqlite`` / ``+asyncpg`` async drivers to their sync equivalents
# for migration purposes.  Set ``VPP_DATABASE_URL`` to override.

[alembic]
script_location = %(here)s/src/vpp/migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
