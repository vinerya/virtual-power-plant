repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8  # keep in sync with the ruff pin in pyproject.toml / ci.yml
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # mypy runs in the project environment (``pip install -e ".[dev,api,db,cli]"``)
  # rather than an isolated hook env: it needs the pydantic plugin and the real
  # third-party types to give the same answer as CI.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/vpp --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false
