[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-power-plant"
version = "2.0.0"
description = "Open-source Virtual Power Plant platform: DER dispatch optimization, tariffs and billing, V2G, demand response and grid protocol integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Moudather Chelbi", email = "moudather.chelbi@gmail.com"},
    {name = "Mariem Khemir"},
]
keywords = ["virtual-power-plant", "energy", "optimization", "trading", "v2g", "der", "grid", "microgrid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Energy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "pulp>=2.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
]
db = [
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
]
migrations = [
    "alembic>=1.13.0",
    # alembic/env.py rewrites postgresql+asyncpg URLs to the sync psycopg2 driver.
    "psycopg2-binary>=2.9",
]
protocols = [
    "paho-mqtt>=1.6.0",
    "pymodbus>=3.6.0",
    "lxml>=5.0.0",
    "httpx>=0.26.0",  # OpenADR 2.0b VEN + IEEE 2030.5 HTTPS clients
]
research = [
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "cvxpy>=1.4.0",
]
cli = [
    "click>=8.1.0",
    "rich>=13.7.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
]
solver = [
    "pyomo>=6.7",
    "highspy>=1.7",
]
degradation = [
    "numpy>=1.24.0",
    "rainflow>=3.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    # Linters pinned to the versions CI runs (.github/workflows/ci.yml) so local
    # and CI results match; bump them together.
    "ruff==0.15.8",
    "mypy==2.3.1",
    "types-PyYAML",
    "pre-commit>=3.6.0",
    "bandit>=1.7.0",
]
all = [
    "virtual-power-plant[api,db,protocols,research,cli,monitoring,dev]",
]

[project.urls]
Homepage = "https://github.com/vinerya/virtual-power-plant"
Documentation = "https://github.com/vinerya/virtual-power-plant/tree/main/docs"
Repository = "https://github.com/vinerya/virtual-power-plant"
Issues = "https://github.com/vinerya/virtual-power-plant/issues"
Changelog = "https://github.com/vinerya/virtual-power-plant/blob/main/CHANGELOG.md"

[project.scripts]
vpp = "vpp.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vpp = [
    "py.typed",
    "tariffs/presets/*.json",
    # alembic environment + revisions, so ``vpp migrate`` works from a wheel.
    "migrations/README.md",
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.ruff]
target-version = "py310"
line-length = 99
# Alembic revision scripts are generated from script.py.mako and are
# historical records; keep them byte-stable rather than re-linting them.
extend-exclude = ["src/vpp/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for FastAPI Depends)
    "SIM108", # use ternary operator (readability preference)
]

[tool.ruff.lint.flake8-type-checking]
# FastAPI, Pydantic and SQLAlchemy evaluate annotations at *runtime*
# (request/response validation, dependency injection, ``Mapped[...]``
# column inference).  Moving the names those annotations reference into an
# ``if TYPE_CHECKING:`` block turns them into NameErrors at import/request
# time, so tell ruff which classes resolve their annotations at runtime.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "vpp.db.base.Base",
]

[tool.ruff.lint.per-file-ignores]
# TC001-003 are unsafe where annotations are resolved at runtime but ruff
# cannot see it:
# - api/ and auth/: FastAPI inspects route and dependency signatures
#   (``session: AsyncSession = Depends(get_db)``, ``request: Request``) via
#   ``typing.get_type_hints`` on every app start.  Routes are registered via
#   ``router.get(...)`` on an *instance*, which ``runtime-evaluated-decorators``
#   cannot match.
# - db/: SQLAlchemy resolves ``Mapped[datetime]`` on plain mixins
#   (``TimestampMixin``) that do not inherit from ``Base``.
# - tests/: pytest fixtures and FastAPI dependency overrides; deferring
#   imports there buys nothing and risks fixture-resolution surprises.
"src/vpp/api/**" = ["TC001", "TC002", "TC003"]
"src/vpp/auth/**" = ["TC001", "TC002", "TC003"]
"src/vpp/db/**" = ["TC001", "TC002", "TC003"]
"tests/**" = ["TC001", "TC002", "TC003"]
# ``pyo = pytest.importorskip("pyomo.environ")`` must run before the pyomo-
# dependent imports so the module is skipped (not errored) without pyomo.
"tests/test_admm_fleet.py" = ["E402"]
"tests/test_fleet_dispatch.py" = ["E402"]
"tests/test_multi_resource_mpc.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["vpp"]
# Keep the installed ``alembic`` library classified as third-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.10"
# Understands pydantic field defaults given positionally (``Field(24, gt=0)``),
# which plain dataclass_transform treats as required fields.
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# vpp.research (numerical exploration) and vpp.benchmarks / vpp.demos
# (synthetic datasets, scenario harness and demo scripts behind ``vpp
# benchmark`` / ``vpp demo``) are NumPy-heavy.  NumPy ufuncs and reductions
# are typed as returning ``Any``, so ``warn_return_any`` would force a cast on
# nearly every function; every other check still applies.
module = ["vpp.research.*", "vpp.benchmarks.*", "vpp.demos.*"]
warn_return_any = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "benchmark: marks benchmark tests",
]

[tool.coverage.run]
source = ["src/vpp"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
