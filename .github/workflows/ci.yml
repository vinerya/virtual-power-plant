name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # mypy needs the runtime dependencies: the pydantic mypy plugin and the
      # real SQLAlchemy/FastAPI/NumPy types (without them every ORM query is
      # ``Any``).  Linter versions are pinned to match the ``dev`` extra.
      - name: Install dependencies
        run: pip install -e ".[api,db,cli,protocols,monitoring,solver,degradation]" ruff==0.15.8 mypy==2.3.1 types-PyYAML
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src/vpp --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev,api,db,cli]"
      - name: Run tests with coverage
        run: pytest tests/ --cov=src/vpp --cov-report=xml --cov-report=term-missing -x
        env:
          VPP_ENV: testing
          VPP_DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          VPP_SECRET_KEY: "test-secret-key"
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  migrations:
    # Run the alembic history against real PostgreSQL: upgrade to head, check
    # the migrated schema matches the ORM models, then downgrade to base.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vpp
          POSTGRES_PASSWORD: vpp
          POSTGRES_DB: vpp_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpp -d vpp_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VPP_ENV: testing
      VPP_SECRET_KEY: "test-secret-key"
      MIGRATION_DB_URL: "postgresql+psycopg2://vpp:vpp@localhost:5432/vpp_migrations"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with migration dependencies
        run: pip install -e ".[dev,db,migrations,cli]"
      - name: vpp migrate (from outside the checkout)
        # Migrations ship inside the package, so this must not depend on CWD.
        working-directory: ${{ runner.temp }}
        run: vpp migrate
        env:
          VPP_DATABASE_URL: ${{ env.MIGRATION_DB_URL }}
      - name: Schema drift check against PostgreSQL
        run: pytest tests/test_alembic_drift.py -v
        env:
          VPP_MIGRATION_TEST_DB_URL: ${{ env.MIGRATION_DB_URL }}
      - name: alembic downgrade base
        run: alembic -x url="$MIGRATION_DB_URL" downgrade base
      - name: alembic upgrade head (again, after a full downgrade)
        run: alembic -x url="$MIGRATION_DB_URL" upgrade head

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit
      - name: Security scan
        run: bandit -r src/vpp -ll --skip B101

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vpp:test .
      - name: Verify image starts
        run: |
          docker run -d --name vpp-test -p 8000:8000 \
            -e VPP_DATABASE_URL=sqlite+aiosqlite:///./test.db \
            -e VPP_SECRET_KEY=test-key \
            vpp:test
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop vpp-test
