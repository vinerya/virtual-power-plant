name: Release

# Publishes a release when a version tag (v3.0.0, v3.1.0rc1, ...) is pushed.
# See docs/releasing.md for the maintainer checklist.
#
# Order: CI (the full ci.yml) + verify (tag == package version, changelog
# section present) + build (sdist/wheel, twine check, install smoke test)
# -> PyPI and GHCR -> GitHub Release. Nothing is published unless every
# check passes.
#
# One-time setup (repository admin):
#
#   PyPI trusted publishing (no API token is stored in GitHub):
#     https://pypi.org/manage/project/virtual-power-plant/settings/publishing/
#     -> "Add a new publisher" -> GitHub, with
#        owner: vinerya, repository: virtual-power-plant,
#        workflow: release.yml, environment: pypi
#     (Before the project exists on PyPI, add it as a "pending publisher"
#     from https://pypi.org/manage/account/publishing/.)
#   GitHub environment: Settings -> Environments -> New environment "pypi";
#     optionally add required reviewers and restrict it to tags "v*".
#   GHCR: nothing to configure; the job pushes with GITHUB_TOKEN
#     (packages: write). After the first push, make the package public under
#     the repository's Packages settings if it should be pullable anonymously,
#     and check Settings -> Actions -> General -> Workflow permissions allows
#     workflows to request write scopes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Distinct from ci.yml's "<workflow>-<ref>" group (which, when called from
# here, is "Release-<ref>"; group names are case-insensitive), or the called
# CI would wait on this run forever.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify tag, version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag must match the package version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag} pyproject version=${version}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::Tag ${tag} does not match pyproject.toml version ${version} (expected v${version})"
            exit 1
          fi
          # PEP 440 pre-releases (3.1.0a1, 3.1.0b2, 3.1.0rc1, 3.1.0.dev1)
          if echo "${version}" | grep -Eq '(a|b|rc|\.dev)[0-9]+$'; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md must have a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Body of "## [X.Y.Z] - date" up to the next "## [" heading.
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no (or an empty) '## [${VERSION}]' section"
            exit 1
          fi
          echo "Release notes: $(wc -l < release-notes.md) lines"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build and check distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          ls -l dist
      - name: twine check
        run: twine check --strict dist/*
      - name: Install the wheel in a clean venv and smoke-test it
        # From outside the checkout, so nothing is imported from src/.
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m venv smoke
          smoke/bin/pip install "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)[api,db,cli]"
          test "$(smoke/bin/vpp --version)" = "vpp, version ${VERSION}"
          test "$(smoke/bin/python -c 'import vpp; print(vpp.__version__)')" = "${VERSION}"
          # The alembic migrations must ship inside the wheel.
          VPP_DATABASE_URL="sqlite+aiosqlite:///${RUNNER_TEMP}/smoke.db" smoke/bin/vpp migrate
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [ci, verify, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/virtual-power-plant/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    name: Publish image to GHCR
    needs: [ci, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lower-cases the image name as GHCR requires.
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=vpp-api
            org.opencontainers.image.description=Open-source Virtual Power Plant platform - API
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: [verify, publish-pypi, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"
